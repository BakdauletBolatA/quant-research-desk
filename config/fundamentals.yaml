# ---------------------------------------------------------------------------
# Banks are NOT valued with FCFF.
# Free cash flow to the firm is meaningless when leverage *is* the business and
# working capital is the balance sheet. We use an excess-return (residual
# income) model instead:  V0 = BV0 + PV[(ROE_t - Ke) * BV_{t-1}]
# ---------------------------------------------------------------------------
excess_return:
  JPM:
    fiscal_year: "FY2025"
    book_value_equity: 360000
    shares_diluted: 2760
    roe_path: [0.165, 0.155, 0.148, 0.140, 0.135]
    payout_ratio: 0.45
    beta: 1.05
    terminal_roe: 0.130
    terminal_growth: 0.030
  BAC:
    fiscal_year: "FY2025"
    book_value_equity: 300000
    shares_diluted: 7500
    roe_path: [0.105, 0.108, 0.110, 0.110, 0.110]
    payout_ratio: 0.45
    beta: 1.15
    terminal_roe: 0.105
    terminal_growth: 0.030

# ---------------------------------------------------------------------------
# Monte-Carlo uncertainty around the DCF drivers (triangular / normal priors)
# ---------------------------------------------------------------------------
monte_carlo:
  revenue_growth_shock_sd: 0.020   # absolute, applied to every forecast year
  ebit_margin_shock_sd:    0.020   # absolute margin points
  wacc_shock_sd:           0.0075
  terminal_growth_shock_sd: 0.0040
  terminal_growth_cap_spread: 0.010  # g must stay <= WACC - 100bp
