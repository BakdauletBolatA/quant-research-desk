# ============================================================================
#  ANALYST INPUT SHEET  —  valuation drivers
# ----------------------------------------------------------------------------
#  IMPORTANT / HONESTY NOTE
#  These are the *modeller's own normalised estimates*, rounded to the nearest
#  round figure and stated in USD millions. They are the equivalent of the blue
#  input cells in a banking model: they are meant to be re-keyed from the latest
#  10-K / 10-Q before any decision is taken. Nothing here is a data feed, and
#  no output of this repository is investment advice.
#
#  Every valuation output is therefore reported *with* a sensitivity grid and a
#  Monte-Carlo distribution — the point estimate on its own is close to useless.
# ============================================================================

meta:
  as_of: "2026-09-09"
  units: "USD millions (shares in millions)"
  basis: "Normalised last-twelve-months / latest reported fiscal year"

# ---------------------------------------------------------------------------
# Macro / market inputs shared by every model
# ---------------------------------------------------------------------------
